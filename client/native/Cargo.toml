[package]
name = "wikit-client-native"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
nsh-core.workspace = true
wikit-core = { path = "../../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
