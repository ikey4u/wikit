<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body>
    <main class="settings-layout">
      <aside class="settings-sidebar">
        <div class="sidebar-spacer"></div>
        <button id="modelTab" class="settings-tab is-active" type="button">模型</button>
        <button id="shortcutTab" class="settings-tab" type="button">快捷键</button>
      </aside>
      <section class="settings-content">
        <section id="modelPanel" class="settings-panel">
          <header class="settings-header">
            <div>
              <div class="settings-kicker">Model</div>
              <h1>模型设置</h1>
            </div>
            <div class="settings-state">未连接</div>
          </header>
          <section class="settings-card">
            <label class="settings-field">
              <span>Provider</span>
              <select id="providerSelect">
                <option value="openai-compatible">OpenAI Compatible</option>
                <option value="deepseek">DeepSeek</option>
                <option value="ollama">Ollama</option>
                <option value="llama-cpp">llama.cpp</option>
                <option value="vllm">vLLM</option>
              </select>
            </label>
            <label class="settings-field">
              <span>Endpoint</span>
              <input id="endpointInput" type="text" value="http://127.0.0.1:11434" spellcheck="false">
            </label>
            <label class="settings-field">
              <span>Model</span>
              <input id="modelInput" type="text" value="qwen2.5:7b" spellcheck="false">
              <select id="modelSelect" hidden>
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
              </select>
            </label>
            <label class="settings-field">
              <span>API Key</span>
              <input id="apiKeyInput" type="password" placeholder="外部模型需要，本地模型可留空">
            </label>
          </section>
          <section class="settings-card settings-grid">
            <label class="settings-field">
              <span>Temperature</span>
              <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0.2">
            </label>
            <label class="settings-field">
              <span>Timeout</span>
              <input id="timeoutInput" type="number" min="5" max="300" step="1" value="60">
            </label>
          </section>
          <footer class="settings-actions">
            <button id="testConnectionButton" class="ghost-action" type="button">测试连接</button>
            <button id="saveSettingsButton" class="primary-action" type="button">保存设置</button>
          </footer>
          <p id="settingsMessage" class="settings-message">模型设置已就绪。</p>
        </section>
        <section id="shortcutPanel" class="settings-panel is-hidden">
          <header class="settings-header">
            <div>
              <div class="settings-kicker">Shortcuts</div>
              <h1>快捷键</h1>
            </div>
          </header>
          <section class="settings-card">
            <label class="settings-field">
              <span>全局显示/隐藏窗口</span>
              <div class="shortcut-editor">
                <input id="toggleShortcutInput" type="text" value="Alt+1" spellcheck="false" placeholder="例如：Alt+1">
                <button id="recordShortcutButton" class="ghost-action" type="button">录制</button>
              </div>
            </label>
            <p class="shortcut-note">点击录制后按下你想使用的组合键，也可以直接编辑输入框中的 Electron accelerator 字符串。</p>
          </section>
          <footer class="settings-actions">
            <button id="saveShortcutButton" class="primary-action" type="button">保存快捷键</button>
          </footer>
          <p id="shortcutMessage" class="settings-message">快捷键设置已就绪。</p>
        </section>
      </section>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
