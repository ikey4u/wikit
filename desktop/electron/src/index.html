<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: http://127.0.0.1:*; script-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline' http://127.0.0.1:*; img-src 'self' data: blob: http://127.0.0.1:*; media-src 'self' data: blob: http://127.0.0.1:*; frame-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*;">
    <title>Bootsmind Wikit</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="traffic-spacer"></div>
        <nav class="sidebar-nav" aria-label="Primary">
          <button id="translateTab" class="sidebar-tab is-active" type="button" title="Translate" aria-label="Translate">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
            </svg>
          </button>
          <button id="dictTab" class="sidebar-tab" type="button" title="Dictionary" aria-label="Dictionary">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 7v14"/><path d="M16 12h2"/><path d="M16 8h2"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/><path d="M6 12h2"/><path d="M6 8h2"/>
            </svg>
          </button>
          <button id="toolsTab" class="sidebar-tab" type="button" title="Tools" aria-label="Tools">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </button>
        </nav>
        <button id="settingsButton" class="sidebar-tab sidebar-settings" type="button" title="Settings" aria-label="Settings">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </aside>
      <main class="main-region">
        <div class="app-shell">
          <section id="translatePage" class="app-panel translate-page">
            <div class="translate-shell">
              <div class="translate-controls">
                <div class="custom-select language-picker">
                  <input id="sourceLanguageSelect" type="hidden" value="auto">
                  <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="select-caption">源语言</span>
                    <span class="select-value">自动检测</span>
                    <span class="select-caret"></span>
                  </button>
                  <div class="select-menu" role="listbox">
                    <button class="select-option is-selected" type="button" role="option" data-value="auto" aria-selected="true">自动检测</button>
                    <button class="select-option" type="button" role="option" data-value="en">English</button>
                    <button class="select-option" type="button" role="option" data-value="zh">中文</button>
                    <button class="select-option" type="button" role="option" data-value="ja">日本語</button>
                    <button class="select-option" type="button" role="option" data-value="ko">한국어</button>
                  </div>
                </div>
                <span class="language-arrow">→</span>
                <div class="custom-select language-picker">
                  <input id="targetLanguageSelect" type="hidden" value="zh">
                  <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="select-caption">目标语言</span>
                    <span class="select-value">中文</span>
                    <span class="select-caret"></span>
                  </button>
                  <div class="select-menu" role="listbox">
                    <button class="select-option is-selected" type="button" role="option" data-value="zh" aria-selected="true">中文</button>
                    <button class="select-option" type="button" role="option" data-value="en">English</button>
                    <button class="select-option" type="button" role="option" data-value="ja">日本語</button>
                    <button class="select-option" type="button" role="option" data-value="ko">한국어</button>
                  </div>
                </div>
                <div class="translate-actions">
                  <button id="translateAction" class="primary-action" type="button">翻译</button>
                  <button id="clearTranslationAction" class="ghost-action" type="button">清空</button>
                  <button id="openTranslationSettings" class="ghost-action" type="button">模型设置</button>
                </div>
              </div>
              <textarea id="translationInput" class="translation-input" spellcheck="false" placeholder="输入要翻译的文本"></textarea>
              <div id="translationOutput" class="translation-output" tabindex="0">
                <div class="output-placeholder">输入文本后会自动翻译。</div>
              </div>
              <section class="history-panel" aria-label="Translation history">
                <div class="history-head">
                  <span>历史翻译</span>
                </div>
                <div id="translationHistoryList" class="history-list"></div>
              </section>
            </div>
          </section>
          <section id="wordPage" class="app-panel word-page is-hidden">
            <div id="noDictionary" class="dict-empty is-hidden">
              <div class="dict-empty-card">
                <div class="dict-empty-icon" aria-hidden="true">
                  <svg viewBox="0 0 48 48" fill="none">
                    <path d="M10 8h12a4 4 0 0 1 4 4v28H14a4 4 0 0 1-4-4V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M22 8h12a4 4 0 0 1 4 4v28H26a4 4 0 0 1-4-4V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M14 16h8M14 22h8M26 16h8M26 22h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
                <h2 class="dict-empty-title">添加你的第一本词典</h2>
                <p class="dict-empty-desc">从本机选择词典文件，导入后即可开始查词。</p>
                <div class="dict-empty-imports">
                  <button id="importWikitDictBtn" class="dict-empty-import" type="button">
                    <span class="dict-empty-import-badge">WIKIT</span>
                    <span class="dict-empty-import-copy">
                      <strong>导入 Bootsmind 词典</strong>
                      <span>.wikit 本地词典包</span>
                    </span>
                    <svg class="dict-empty-import-arrow" viewBox="0 0 20 20" aria-hidden="true">
                      <path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                  <button id="importMdxDictBtn" class="dict-empty-import" type="button">
                    <span class="dict-empty-import-badge is-mdx">MDX</span>
                    <span class="dict-empty-import-copy">
                      <strong>导入 MDX 词典</strong>
                      <span>自动转换后加载</span>
                    </span>
                    <svg class="dict-empty-import-arrow" viewBox="0 0 20 20" aria-hidden="true">
                      <path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
                <p id="importDictStatus" class="dict-empty-status is-hidden" role="status"></p>
                <div class="dict-empty-footer">
                  <button id="openConfigDirBtn" class="dict-empty-footer-btn" type="button">配置目录</button>
                  <span class="dict-empty-footer-sep" aria-hidden="true"></span>
                  <a class="dict-empty-footer-link" href="https://github.com/ikey4u/wikit/wiki/Home" target="_blank" rel="noopener">安装说明</a>
                </div>
              </div>
            </div>
            <div id="wordContent" class="workspace is-hidden">
              <div class="toolbar">
                <div class="field has-addons">
                  <div class="control history-nav-control">
                    <button id="lookupBackBtn" class="history-nav-btn" type="button" title="上一个词条" aria-label="上一个词条" disabled>
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 3.2 5.4 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button id="lookupForwardBtn" class="history-nav-btn" type="button" title="下一个词条" aria-label="下一个词条" disabled>
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 3.2 10.6 8 5.8 12.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                  </div>
                  <div class="control dictionary-control">
                    <span class="select is-rounded is-small">
                      <select id="dictSelect"></select>
                    </span>
                  </div>
                  <div class="control search-control has-icons-left is-expanded">
                    <input id="searchInput" class="input is-rounded is-small" autocomplete="none" autocorrect="off" autocapitalize="none" spellcheck="false" type="text" placeholder="Search a word">
                    <span class="icon is-small is-left">⌕</span>
                    <div id="suggestionPopup" class="suggestion-popup is-hidden"></div>
                  </div>
                  <div class="control dict-menu-control">
                    <button id="dictMenuBtn" class="dict-menu-btn" type="button" title="词典操作" aria-label="词典操作" aria-haspopup="menu" aria-expanded="false">
                      <svg viewBox="0 0 20 20" aria-hidden="true">
                        <circle cx="10" cy="4.5" r="1.5" fill="currentColor"/>
                        <circle cx="10" cy="10" r="1.5" fill="currentColor"/>
                        <circle cx="10" cy="15.5" r="1.5" fill="currentColor"/>
                      </svg>
                    </button>
                    <div id="dictMenu" class="dict-menu is-hidden" role="menu">
                      <div class="dict-menu-label">添加词典</div>
                      <button id="toolbarImportWikitBtn" class="dict-menu-item" type="button" role="menuitem">Bootsmind 词典 (.wikit)</button>
                      <button id="toolbarImportMdxBtn" class="dict-menu-item" type="button" role="menuitem">MDX 词典 (.mdx)</button>
                      <div class="dict-menu-divider" role="separator"></div>
                      <button id="toolbarEditDictBtn" class="dict-menu-item" type="button" role="menuitem">修改词典</button>
                      <button id="toolbarRemoveDictBtn" class="dict-menu-item is-danger" type="button" role="menuitem">删除词典</button>
                    </div>
                  </div>
                </div>
                <p id="toolbarImportStatus" class="dict-toolbar-status is-hidden" role="status"></p>
              </div>
              <div class="reader-surface">
                <div id="meaningPlaceholder" class="reader-placeholder">Type a word to look up ...</div>
                <div id="candidateList" class="candidate-list is-hidden"></div>
                <div id="noCandidate" class="reader-placeholder is-hidden">Nothing is there ...</div>
                <iframe id="meaningFrame" class="meaning-frame is-hidden" title="word meaning"></iframe>
                <iframe id="previewFrame" class="meaning-frame is-hidden" title="Bootsmind Wikit live preview"></iframe>
              </div>
            </div>
          </section>
          <section id="toolsPage" class="app-panel tools-page is-hidden">
            <div class="tools-header">
              <div class="tools-tab-bar">
                <button id="dictMakerTab" class="tools-inner-tab is-active" type="button" data-tool="dict-maker">词典制作</button>
                <button id="dictEditorTab" class="tools-inner-tab" type="button" data-tool="dict-editor">词典编辑</button>
                <button id="mdxConverterTab" class="tools-inner-tab" type="button" data-tool="mdx-converter">MDX 转换</button>
                <button id="moreToolsTab" class="tools-inner-tab tools-more-tab is-hidden" type="button" aria-haspopup="true">
                  ...
                  <div class="tools-more-menu" role="menu"></div>
                </button>
              </div>
            </div>
            <div class="tools-content">
              <div id="dictMakerContent" class="tool-content">
                <div class="dm-topbar">
                  <button id="openDictDir" class="dm-dir-btn" type="button" title="Open Dictionary Directory">选择词典目录</button>
                  <div style="flex:1"></div>
                  <button id="addEntryBtn" class="dm-dir-btn" type="button">+ 添加词条</button>
                  <button id="batchImportBtn" class="dm-import-btn" type="button">批量导入</button>
                </div>
                <div class="dm-body">
                  <div class="dm-sidebar">
                    <div class="dm-sidebar-actions">
                      <button id="editMetaBtn" class="dm-dir-btn" type="button">元信息</button>
                      <button id="importCssBtn" class="dm-dir-btn" type="button">导入 CSS</button>
                      <button id="importJsBtn" class="dm-dir-btn" type="button">导入 JS</button>
                    </div>
                    <div class="dm-search-wrap">
                      <input id="dictMakerSearch" class="dm-search" type="text" placeholder="搜索词条...">
                    </div>
                    <div id="entriesList" class="entries-list">
                      <div class="entries-empty">请先选择词典目录</div>
                    </div>
                  </div>
                  <div class="dm-editor">
                    <div class="dm-editor-toolbar">
                      <div class="editor-tabs">
                        <button class="editor-tab is-active" type="button" data-editor="content">内容</button>
                        <button class="editor-tab" type="button" data-editor="css">CSS</button>
                        <button class="editor-tab" type="button" data-editor="js">JS</button>
                      </div>
                      <div class="editor-type-selector">
                        <select id="contentType">
                          <option value="html">HTML</option>
                          <option value="markdown">Markdown</option>
                        </select>
                        <button id="togglePreviewBtn" class="dm-preview-btn" type="button">预览</button>
                      </div>
                    </div>
                    <div id="dmEditMode" class="dm-edit-pane">
                      <div id="contentEditor" class="code-editor" contenteditable="true" spellcheck="false"></div>
                      <div id="cssEditor" class="code-editor is-hidden" contenteditable="true" spellcheck="false"></div>
                      <div id="jsEditor" class="code-editor is-hidden" contenteditable="true" spellcheck="false"></div>
                    </div>
                    <div id="dmPreviewMode" class="dm-preview-pane is-hidden">
                      <div class="preview-options">
                        <label class="preview-toggle"><input type="checkbox" id="showCssPreview" checked><span>CSS</span></label>
                        <label class="preview-toggle"><input type="checkbox" id="showJsPreview" checked><span>JS</span></label>
                      </div>
                      <iframe id="previewIframe" class="preview-frame-full" title="dictionary preview"></iframe>
                    </div>
                  </div>
                </div>
                <div class="dm-bottombar">
                  <button id="saveEntryBtn" class="ghost-action" type="button">保存</button>
                  <button id="deleteEntryBtn" class="ghost-action" type="button">删除</button>
                  <span id="saveStatus" class="save-status"></span>
                  <div style="flex:1"></div>
                  <button id="buildDictBtn" class="ghost-action" type="button">构建词典</button>
                </div>
              </div>
              <div id="dictEditorContent" class="tool-content is-hidden">
                <div class="de-topbar">
                  <select id="deDictSelect" class="de-dict-select">
                    <option value="">选择词典...</option>
                  </select>
                  <button id="deOpenLocalDictBtn" class="de-meta-btn" type="button">选择本地词典</button>
                  <button id="deImportCssBtn" class="de-meta-btn" type="button">导入 CSS</button>
                  <button id="deImportJsBtn" class="de-meta-btn" type="button">导入 JS</button>
                  <div style="flex:1"></div>
                  <button id="deEditMetaBtn" class="de-meta-btn is-hidden" type="button">元信息</button>
                </div>
                <div class="de-body">
                  <div class="de-sidebar">
                    <div class="de-search-wrap">
                      <input id="deSearchInput" class="de-search" type="text" placeholder="搜索词条..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                    </div>
                    <div id="deEntryList" class="de-entry-list">
                      <div class="de-empty">请选择词典</div>
                    </div>
                  </div>
                  <div class="de-main">
                    <div class="de-editor-toolbar">
                      <div class="de-editor-tabs">
                        <button class="de-editor-tab is-active" type="button" data-de-editor="html">内容</button>
                        <button class="de-editor-tab" type="button" data-de-editor="css">CSS</button>
                        <button class="de-editor-tab" type="button" data-de-editor="js">JS</button>
                      </div>
                      <div class="de-editor-actions">
                        <button id="deTogglePreviewBtn" class="dm-preview-btn" type="button">预览</button>
                        <select id="deForceFormatSelect" class="de-format-select" title="强制指定预览格式">
                          <option value="html">HTML</option>
                          <option value="txt">TXT</option>
                          <option value="md">MD</option>
                        </select>
                      </div>
                    </div>
                    <div id="deEditMode" class="de-edit-pane">
                      <div id="deHtmlEditor" class="code-editor de-code-editor" contenteditable="true" spellcheck="false"></div>
                      <div id="deCssEditor" class="code-editor de-code-editor is-hidden" contenteditable="true" spellcheck="false"></div>
                      <div id="deJsEditor" class="code-editor de-code-editor is-hidden" contenteditable="true" spellcheck="false"></div>
                    </div>
                    <div id="dePreviewMode" class="de-preview-pane is-hidden">
                      <iframe id="deViewer" class="de-viewer" title="entry viewer"></iframe>
                    </div>
                  </div>
                </div>
                <div class="de-bottombar">
                  <button id="deSaveBtn" class="ghost-action" type="button" disabled>保存</button>
                  <span id="deSaveStatus" class="save-status"></span>
                  <div style="flex:1"></div>
                  <button id="deExportBtn" class="ghost-action" type="button">打包样式并导出</button>
                </div>
              </div>
              <div id="mdxConverterContent" class="tool-content is-hidden">
                <div class="mdx-converter-placeholder">
                  <p>拖拽 MDX 文件到此处，或点击选择文件</p>
                  <button id="selectMdxFile" class="primary-action" type="button">选择 MDX 文件</button>
                  <div id="mdxConverterProgress" class="mdx-converter-progress is-hidden">
                    <div class="dm-progress-fill"></div>
                    <span class="dm-progress-text">0%</span>
                  </div>
                  <div id="mdxConverterStatus" class="mdx-converter-status"></div>
                  <button id="openMdxOutputBtn" class="ghost-action is-hidden" type="button">打开产物位置</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div id="dmPromptOverlay" class="dm-prompt-overlay is-hidden">
      <div class="dm-prompt-dialog">
        <div id="dmPromptLabel" class="dm-prompt-label"></div>
        <input id="dmPromptInput" class="dm-prompt-input" type="text" autocomplete="off">
        <div class="dm-prompt-actions">
          <button id="dmPromptCancel" class="dm-prompt-btn dm-prompt-cancel" type="button">取消</button>
          <button id="dmPromptOk" class="dm-prompt-btn dm-prompt-ok" type="button">确定</button>
        </div>
      </div>
    </div>
    <div id="batchImportOverlay" class="dm-prompt-overlay is-hidden">
      <div class="dm-prompt-dialog">
        <div class="dm-prompt-label">批量导入</div>
        <textarea id="batchImportText" class="dm-batch-textarea" placeholder="粘贴 wikit 源文件内容&#10;格式: keyword\nbody\n&lt;/&gt;&#10;每条词条以 &lt;/&gt; 分隔"></textarea>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="batchImportFileBtn" class="dm-prompt-btn dm-prompt-cancel" type="button">选择文件</button>
          <span id="batchImportFileName" class="dm-batch-filename"></span>
        </div>
        <div class="dm-prompt-actions">
          <button id="batchImportCancel" class="dm-prompt-btn dm-prompt-cancel" type="button">取消</button>
          <button id="batchImportConfirm" class="dm-prompt-btn dm-prompt-ok" type="button">导入</button>
        </div>
      </div>
    </div>
    <div id="metaEditOverlay" class="dm-prompt-overlay is-hidden">
      <div class="dm-meta-dialog">
        <div class="dm-meta-title">词典元信息</div>
        <div class="dm-meta-fields">
          <div class="dm-meta-field">
            <label class="dm-meta-label">名称</label>
            <input id="metaName" class="dm-meta-input" type="text" placeholder="词典名称">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">版本</label>
            <input id="metaVersion" class="dm-meta-input" type="text" placeholder="1.0">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">作者</label>
            <input id="metaAuthors" class="dm-meta-input" type="text" placeholder="逗号分隔，如: Alice, Bob">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">发行方</label>
            <input id="metaDistributors" class="dm-meta-input" type="text" placeholder="逗号分隔">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">描述</label>
            <input id="metaDescription" class="dm-meta-input" type="text" placeholder="词典描述">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">主页</label>
            <input id="metaHomepage" class="dm-meta-input" type="text" placeholder="https://...">
          </div>
        </div>
        <div class="dm-prompt-actions">
          <button id="metaEditCancel" class="dm-prompt-btn dm-prompt-cancel" type="button">取消</button>
          <button id="metaEditSave" class="dm-prompt-btn dm-prompt-ok" type="button">保存</button>
        </div>
      </div>
    </div>
    <div id="deMetaOverlay" class="dm-prompt-overlay is-hidden">
      <div class="dm-meta-dialog">
        <div class="dm-meta-header">
          <div class="dm-meta-title">词典元信息</div>
          <button id="deMetaCloseTop" class="dm-meta-close" type="button">关闭</button>
        </div>
        <div class="dm-meta-fields">
          <div class="dm-meta-field">
            <label class="dm-meta-label">名称</label>
            <input id="deMetaName" class="dm-meta-input" type="text" placeholder="词典名称">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">描述</label>
            <input id="deMetaDesc" class="dm-meta-input" type="text" placeholder="词典描述">
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">CSS</label>
            <textarea id="deMetaCss" class="dm-batch-textarea" rows="5" placeholder="词典样式"></textarea>
          </div>
          <div class="dm-meta-field">
            <label class="dm-meta-label">JS</label>
            <textarea id="deMetaJs" class="dm-batch-textarea" rows="5" placeholder="词典脚本"></textarea>
