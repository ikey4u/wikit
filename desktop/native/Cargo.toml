[package]
name = "wikit-native"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
axum = "0.5"
napi = "2.14.3"
napi-derive = "2.14.3"
once_cell = "1.9.0"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.2", features = ["fs"] }
wikit-core = { path = "../../core" }

[build-dependencies]
napi-build = "2.1.0"

[features]
noop = []
