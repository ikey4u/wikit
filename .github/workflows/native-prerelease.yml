name: Alpha release
on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Validate alpha versions
        run: mise run release:check
      - name: Test all workspace packages and native screens
        run: mise run test
      - name: Check iOS source entry
        run: mise exec -- nsh check client/ios

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            entry: desktop
          - platform: android-arm64
            os: ubuntu-24.04
            entry: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
          cache: true
          cache_save_post: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            client/${{ matrix.entry }} -> target
          key: alpha-${{ matrix.platform }}
      - name: Validate tag and application versions
        if: startsWith(github.ref, 'refs/tags/')
        run: mise exec -- python scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Install Android SDK and NDK with mise
        if: runner.os == 'Linux'
        run: mise run setup:android
      - name: Check native bindings and interface
        run: mise exec -- nsh check client/${{ matrix.entry }}
      - name: Build matching Android host runtime
        if: runner.os == 'Linux'
        run: mise run build:android-runtime
      - name: Build and verify release packages
        run: mise exec -- python scripts/package-release.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish alpha release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
          install_args: python gh
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create verified English alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py
