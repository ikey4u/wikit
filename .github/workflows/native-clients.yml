name: Workspace validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Validate alpha versions
        run: mise run release:check
      - name: Check workspace formatting
        run: mise exec -- cargo fmt --all -- --check
      - name: Test workspace and native interaction
        run: mise run test
      - name: Check all native entries
        run: mise run check:native
      - name: Build tools and run terminal/server smoke tests
        run: |
          mise exec -- cargo build --locked -p wikit -p wikit-server -p wikit-tui
          mise exec -- python scripts/smoke.py
