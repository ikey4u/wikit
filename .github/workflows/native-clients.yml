name: Native clients

on:
  pull_request:
    branches: [master]
    paths: ['client/**', 'core/**', 'proto/**', '.github/workflows/native-clients.yml']
  push:
    branches: [master]
    paths: ['client/**', 'core/**', 'proto/**', '.github/workflows/native-clients.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      - name: Test shared native logic
        run: cargo test --manifest-path client/Cargo.toml --locked -p wikit-client-native
      - name: Install the matching NSH CLI
        run: cargo install --git https://github.com/longbridge/nsh --rev e40afd54cd0ca18707bc94ec836bd4eb4b977a75 --locked nsh-cli
      - name: Check all three application entries
        run: |
          nsh check client/desktop
          nsh check client/ios
          nsh check client/android
      - name: Test shared native screens
        run: nsh test client/desktop
